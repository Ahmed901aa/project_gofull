<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Wrecker-style tow truck (side view). Cab on the RIGHT = LTR forward
       direction; TowTruckIcon mirrors this whole SVG in RTL. Single-color
       line art: every stroke is black; the app tints via ColorFilter, so
       keep exactly one color here. -->

  <!-- Ground -->
  <path d="M2 41h44" stroke="black" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>

  <!-- Truck cab -->
  <path d="M27 37V22a2 2 0 0 1 2-2h5.5a2 2 0 0 1 1.67.9l3.5 5.2a2 2 0 0 1 .33 1.1V37"
        stroke="black" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Cab windshield -->
  <path d="M30.5 22.6h4l2.4 3.8h-6.4z"
        stroke="black" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Chassis under cab -->
  <path d="M25 37h15" stroke="black" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Boom base — triangular support that sits on the truck bed -->
  <path d="M20 37h9v-13z" stroke="black" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Main boom arm, thick, angled up to the back-left -->
  <path d="M28.5 25 9 11" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Winch cable dropping from the boom tip -->
  <path d="M9 11v6" stroke="black" stroke-width="1.6" stroke-linecap="round"/>
  <!-- J-shaped hook -->
  <path d="M9 17v1.4a2.2 2.2 0 1 1-3.4 1.85"
        stroke="black" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Small car being towed (nose lifted toward the hook) -->
  <path d="M2 37v-3l1.9-4.2a1.7 1.7 0 0 1 1.5-1l6.6-.4a1.7 1.7 0 0 1 1.3.55l3.1 3.35V37"
        stroke="black" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Car greenhouse (window band) -->
  <path d="M4.9 29.5l1.15-2.55a1 1 0 0 1 .9-.6l3.6-.25a1 1 0 0 1 .77.32l1.55 1.7"
        stroke="black" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Wheels: two under the truck, one visible under the towed car -->
  <circle cx="37.5" cy="40" r="3.2" stroke="black" stroke-width="2.4"/>
  <circle cx="28.5" cy="40" r="3.2" stroke="black" stroke-width="2.4"/>
  <circle cx="9" cy="39.5" r="2.4" stroke="black" stroke-width="2"/>
</svg>
