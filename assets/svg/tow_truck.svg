<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tow truck (side view, facing RIGHT = LTR forward direction).
       Single-color line art: every stroke is black; the app tints it via
       ColorFilter, so keep exactly one color here. Mirrored in RTL by
       TowTruckIcon (Transform.flip). -->
  <!-- flatbed / chassis -->
  <path d="M2 33h44" stroke="black" stroke-width="2.6" stroke-linecap="round"/>
  <!-- cab (front, right side) -->
  <path d="M31 33v-9.5a1.5 1.5 0 0 1 1.5-1.5h6.2a2 2 0 0 1 1.7.95l3.3 5.3a2 2 0 0 1 .3 1.05V33"
        stroke="black" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- cab window -->
  <path d="M34.5 25.5h4l2.4 4h-6.4z" stroke="black" stroke-width="2" stroke-linejoin="round"/>
  <!-- towing boom from the bed up toward the back (left) -->
  <path d="M30 31 17 18.5" stroke="black" stroke-width="2.6" stroke-linecap="round"/>
  <!-- winch cable dropping to the towed car's nose -->
  <path d="M17 18.5v6" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- open hook (J-shape, opening to the left) -->
  <path d="M17 24.5v1.6a2.6 2.6 0 1 1-4 2.2" stroke="black" stroke-width="2"
        stroke-linecap="round" fill="none"/>
  <!-- towed car (rear, left side, nose lifted toward the hook), closed shape -->
  <path d="M3 33v-2.2l2.1-4.2a2 2 0 0 1 1.8-1.1h5.4a2 2 0 0 1 1.6.8l2.5 3.3V33"
        stroke="black" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- truck wheels -->
  <circle cx="36.5" cy="35.5" r="3.4" stroke="black" stroke-width="2.4"/>
  <circle cx="26.5" cy="35.5" r="3.4" stroke="black" stroke-width="2.4"/>
  <!-- towed car wheel -->
  <circle cx="8.5" cy="35.5" r="3.4" stroke="black" stroke-width="2.4"/>
</svg>
